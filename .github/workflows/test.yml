# I test girano da soli a ogni push: se qualcosa si rompe, GitHub lo segna
# con una X rossa sul commit. Nessun servizio esterno: e' GitHub stesso.
name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
